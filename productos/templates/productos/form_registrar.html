{% extends 'usuarios/base.html' %}

{% block content %}

<div style="
    background: white;
    padding: 50px;
    margin: 50px;
    border-radius: 18px;
    border-top: 6px solid #f97316;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    color: #1f2937;
">

    <h1>🗡️ Registrar herramienta ninja</h1>

    <p>
        Ingresa los datos de la nueva herramienta.
    </p>

    <form action="/productos/insertar/" method="post">

        {% csrf_token %}

        <label>Nombre de la herramienta:</label>

        <input
            type="text"
            name="txtnom"
            placeholder="Ej: Kunai"
            required
        >

        <label>Proveedor Ninja:</label>

        <select name="cbomar" required>

            <option value="">
                Seleccionar proveedor
            </option>

            <option value="Aldea de la Hoja">
                🍃 Aldea de la Hoja
            </option>

            <option value="Aldea de la Arena">
                🏜️ Aldea de la Arena
            </option>

            <option value="Aldea de la Niebla">
                🌫️ Aldea de la Niebla
            </option>

            <option value="Aldea de la Nube">
                ☁️ Aldea de la Nube
            </option>

            <option value="Aldea de la Roca">
                👊🏿 Aldea de la Roca
            </option>

        </select>

        <label>Precio:</label>

        <input
            type="number"
            name="txtpre"
            placeholder="Ej: 1500"
            min="0"
            required
        >

        <br>

        <button type="submit">
            🗡️ Registrar herramienta
        </button>

    </form>

    <div style="text-align: center;">

        <a href="/productos/listado/">
            ← Volver al inventario
        </a>

    </div>

</div>

{% endblock %}
