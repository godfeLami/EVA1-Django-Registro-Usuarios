{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sistema de Registro Ninja</title>

    <link
        rel="stylesheet"
        href="{% static 'usuarios/css/styles.css' %}"
    >

</head>

<body>

    <header>

        <img
            src="{% static 'usuarios/img/logo.JPG' %}"
            alt="Logo Naruto"
        >

        <button
            type="button"
            class="menu-toggle"
            id="menuToggle"
        >
            ☰
        </button>

        <nav id="menu">

            <a href="/">🏠 Inicio</a>

            <a href="/registro/">👤 Registrarse</a>

            <a href="/login/">🔐 Iniciar sesión</a>

        </nav>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <p>
            🍥 2026 Sistema de Registro de Usuarios - Naruto 🦊
        </p>

    </footer>


    <script
        src="{% static 'usuarios/js/script.js' %}"
    ></script>

</body>

</html>
